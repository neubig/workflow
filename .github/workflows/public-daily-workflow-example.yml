name: Public daily-workflow example

on:
  pull_request:
    paths:
      - "examples/public-daily-workflow-example/**"
      - ".pr/public-daily-workflow-example/**"
      - "tests/test_public_daily_workflow_example.py"
      - ".github/workflows/public-daily-workflow-example.yml"
  push:
    branches:
      - main
    paths:
      - "examples/public-daily-workflow-example/**"
      - ".pr/public-daily-workflow-example/**"
      - "tests/test_public_daily_workflow_example.py"
      - ".github/workflows/public-daily-workflow-example.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate committed public-data fixture
        run: python3 examples/public-daily-workflow-example/demo.py --validate-only
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
